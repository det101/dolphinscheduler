on:
  pull_request:
  push:
    branches:
      - dev
      - '[0-9]+.[0-9]+.[0-9]+-prepare'
      - '[0-9]+.[0-9]+.[0-9]+-release'

name: E2E-K8S

concurrency:
  group: E2E-K8S-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  paths-filter:
    name: E2E-K8S-Path-Filter
    runs-on: ubuntu-latest
    outputs:
      not-ignore: ${{ steps.filter.outputs.not-ignore }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            not-ignore:
              - '!(docs/**)'
  e2e-k8s:
    name: E2E-K8S-Execute
    needs: paths-filter
    if: ${{ (needs.paths-filter.outputs.not-ignore == 'true') || (github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Maximize runner space
        uses: ./.github/actions/maximize-build-space
        with:
          root-reserve-mb: 30720
          temp-reserve-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build Image
        run: |
          ./mvnw -B clean package \
          -Dmaven.test.skip=true \
          -Dspotless.skip=true \
          -Pdocker,staging \
          -Ddocker.tag=ci \
          -Danalyze.skip=true
      - name: Create k8s Kind Cluster
        run: |
          # install kubectl
          curl -LO "https://dl.k8s.io/release/v1.28.3/bin/linux/amd64/kubectl"
          sudo chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          # install kind
          curl -LO https://github.com/kubernetes-sigs/kind/releases/download/v0.20.0/kind-linux-amd64
          sudo chmod +x kind-linux-amd64
          sudo mv kind-linux-amd64 /usr/local/bin/kind
          kind version

          # create kind cluster
          kind_node_image="kindest/node:v1.23.17"
          echo "Kubernetes version: ${kind_node_image}"
          kind create cluster --name dolphinscheduler --image ${kind_node_image}
          kubectl version
          kubectl get all --all-namespaces
          
      - name: Build dolphinscheduler images with MySQL driver
        run: |
          wget -O mysql-connector-java-8.0.16.jar https://repo1.maven.org/maven2/mysql/mysql-connector-java/8.0.16/mysql-connector-java-8.0.16.jar
          components=("master" "worker" "api" "tools" "alert-server")
          registry="apache"
          for component in "${components[@]}"; do
            if [ "$component" = "tools" ]; then
                mkdir -p dolphinscheduler-tools
                cp mysql-connector-java-8.0.16.jar dolphinscheduler-tools/
                echo -e "FROM $registry/dolphinscheduler-tools:latest\nCOPY ../mysql-connector-java-8.0.16.jar /opt/dolphinscheduler/tools/libs/" > dolphinscheduler-tools/Dockerfile
                docker build -t $registry/dolphinscheduler-tools:ci dolphinscheduler-tools
            else
                mkdir -p dolphinscheduler-$component
                cp mysql-connector-java-8.0.16.jar dolphinscheduler-$component/
                echo -e "FROM $registry/dolphinscheduler-$component:latest\nCOPY ../mysql-connector-java-8.0.16.jar /opt/dolphinscheduler/libs/" > dolphinscheduler-$component/Dockerfile
                docker build -t $registry/dolphinscheduler-$component:ci dolphinscheduler-$component
            fi
            kind load docker-image apache/dolphinscheduler-$component:ci --name dolphinscheduler
          done
      - name: Deploy standalone MySQL on K8s
        working-directory: ${{ github.workspace }}/deploy/kubernetes/dolphinscheduler
        run: |
          # Create namespace first
          kubectl create namespace dolphinscheduler

          # Apply the manifests to deploy MySQL
          kubectl apply -n dolphinscheduler -f mysql-k8s.yaml 

          # Wait for MySQL to be ready before proceeding
          echo "Waiting for MySQL to be ready..."
          kubectl wait --for=condition=available --timeout=300s deployment/mysql -n dolphinscheduler
          
          kubectl get pods -n dolphinscheduler
          kubectl get svc -n dolphinscheduler
          echo "Waiting for MySQL service to be ready..."
          MYSQL_POD=$(kubectl get pods -n dolphinscheduler -l app=mysql -o jsonpath="{.items[0].metadata.name}")
          for i in {1..30}; do
            if kubectl exec "$MYSQL_POD" -n dolphinscheduler -- mysql -uroot -proot -e "SELECT 1"; then
              echo "MySQL is ready!"
              break
            else
              echo "Waiting for MySQL to be ready... ($i/30)"
              sleep 5
            fi
          done

          if [ "$i" -eq 30 ]; then
            echo "MySQL did not become ready within the timeout period."
            kubectl describe pod "$MYSQL_POD" -n dolphinscheduler
            echo "pod logs"
            kubectl logs "$MYSQL_POD" -n dolphinscheduler
            exit 1
          fi

      - name: Helm upgrade dolphinscheduler with mysql config
        working-directory: ${{ github.workspace }}/deploy/kubernetes/dolphinscheduler
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency update .
          helm upgrade --install --debug --create-namespace -n dolphinscheduler dolphinscheduler . \
            --set image.tag=ci \
            --set postgresql.enabled=false \
            --set externalDatabase.enabled=true \
            --set externalDatabase.driverClassName="com.mysql.cj.jdbc.Driver" \
            --set externalDatabase.type="mysql" \
            --set externalDatabase.host="mysql" \
            --set externalDatabase.port=3306 \
            --set externalDatabase.user="root" \
            --set externalDatabase.password="root" \
            --set externalDatabase.database="dolphinscheduler" \
            --set master.replicas=1 \
            --set worker.replicas=1 
          
      - name: Helm upgrade dolphinscheduler with pgsql config
        working-directory: ${{ github.workspace }}/deploy/kubernetes/dolphinscheduler
        run: |
          ls mysql-k8s.yaml
          kubectl delete -f mysql-k8s.yaml -n dolphinscheduler
          helm uninstall dolphinscheduler -n dolphinschedule
          kubectl delete namespace dolphinscheduler
          helm upgrade --install --debug --create-namespace -n dolphinscheduler dolphinscheduler . \
            --set image.tag=ci \
            --set postgresql.enabled=true \
            --set externalDatabase.enabled=true \
            --set master.replicas=1 \
            --set worker.replicas=1 

  result:
    name: E2E-K8S-Result
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ e2e-k8s, paths-filter ]
    if: always()
    steps:
      - name: Status
        run: |
          if [[ ${{ needs.paths-filter.outputs.not-ignore }} == 'false' && ${{ github.event_name }} == 'pull_request' ]]; then
            echo "Skip E2E-K8S!"
            exit 0
          fi
          if [[ ${{ needs.e2e-k8s.result }} != 'success' ]]; then
            echo "E2E-K8S Failed!"
            exit -1
          fi
